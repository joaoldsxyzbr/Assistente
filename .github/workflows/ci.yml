name: CI

on:
  pull_request:
  push:
    branches: [main, chore/retire-pc-20261013]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  retire-pc-files:
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/retire-pc-20261013'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Delete retired PC-only code and workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -- src/pc-agent src/mcps/pc tests/pc-tools.test.ts docs/CONTROLE-PC.md docs/RELEASE-PC.md .github/workflows/release-pc.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: remove retired PC agent, relay, tests and release workflow'
          git push origin HEAD:chore/retire-pc-20261013
