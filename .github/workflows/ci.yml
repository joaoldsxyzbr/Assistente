name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run check
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish src/pc-agent/AssistentePc.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/AssistentePc
      - name: Validar layout nativo INPUT (Win32)
        shell: pwsh
        run: |
          & "./dist/AssistentePc/AssistentePc.exe" --check-input-layout
          if ($LASTEXITCODE -ne 0) { throw "Layout INPUT incorreto para a arquitetura do Windows." }
      - uses: actions/upload-artifact@v6
        with:
          name: AssistentePc-win-x64
          path: dist/AssistentePc/
          if-no-files-found: error
