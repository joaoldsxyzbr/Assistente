name: Dependency security

on:
  workflow_dispatch:
  schedule:
    - cron: "18 8 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Audit locked npm dependencies
        run: npm audit --audit-level=high
