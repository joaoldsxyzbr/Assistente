name: Verificar release Assistente PC

on:
  pull_request:
    paths:
      - '.github/workflows/verify-pc-release.yml'
      - 'docs/VALIDACAO-PC-P0-2026-10-10.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente do Assistente PC'
        type: string
        required: true
        default: 'pc-v0.5.0-beta.1'

permissions:
  contents: read

jobs:
  verificar-release:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Baixar pacote publicado e conferir integridade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'pc-v0.5.0-beta.1' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -match '^pc-v([0-9]+)\.([0-9]+)\.([0-9]+)(-beta\.[0-9]+)?
          $dir = Join-Path $env:RUNNER_TEMP 'pc-release-check'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --dir "$dir" --pattern 'AssistentePc-win-x64.zip' --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao baixar release do GitHub.' }
          $zip = Join-Path $dir 'AssistentePc-win-x64.zip'
          $checksums = Join-Path $dir 'SHA256SUMS.txt'
          if (!(Test-Path -LiteralPath $zip) -or !(Test-Path -LiteralPath $checksums)) {
            throw 'Release sem ZIP ou SHA256SUMS.txt.'
          }
          $lines = @(Get-Content -LiteralPath $checksums)
          if ($lines.Count -ne 1 -or $lines[0] -notmatch '^([a-fA-F0-9]{64})\s+AssistentePc-win-x64\.zip$') {
            throw 'Manifesto SHA-256 invalido ou com entradas extras.'
          }
          $expectedHash = $Matches[1].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $expectedHash) { throw 'Hash SHA-256 divergente.' }
          Write-Host 'Integridade do ZIP confirmada por SHA-256.'
          $extract = Join-Path $dir 'extraido'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $exe = Join-Path $extract 'AssistentePc.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Executavel ausente no pacote.' }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($info.FileMajorPart -ne $expectedParts[0] -or
              $info.FileMinorPart -ne $expectedParts[1] -or
              $info.FileBuildPart -ne $expectedParts[2]) {
            throw "Versao do executavel nao corresponde a tag (versao: $($info.FileVersion))."
          }
          Write-Host "Versao do executavel validada: $($info.FileVersion)"
          $process = Start-Process -FilePath $exe -ArgumentList '--check-terminal' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Autoteste de terminal falhou (exit code $($process.ExitCode))."
          }
          Write-Host 'Autoteste de terminal permitido/restrito: OK.'
          Write-Host 'Nota: este teste nao instala o agente no PC pessoal nem valida UI Automation interativa.'
) {
            $expectedParts = @([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
          } else {
            throw 'Tag de release invalida.'
          }
          $dir = Join-Path $env:RUNNER_TEMP 'pc-release-check'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh release download "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --dir "$dir" --pattern 'AssistentePc-win-x64.zip' --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao baixar release do GitHub.' }
          $zip = Join-Path $dir 'AssistentePc-win-x64.zip'
          $checksums = Join-Path $dir 'SHA256SUMS.txt'
          if (!(Test-Path -LiteralPath $zip) -or !(Test-Path -LiteralPath $checksums)) {
            throw 'Release sem ZIP ou SHA256SUMS.txt.'
          }
          $lines = @(Get-Content -LiteralPath $checksums)
          if ($lines.Count -ne 1 -or $lines[0] -notmatch '^([a-fA-F0-9]{64})\s+AssistentePc-win-x64\.zip$') {
            throw 'Manifesto SHA-256 invalido ou com entradas extras.'
          }
          $expectedHash = $Matches[1].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $expectedHash) { throw 'Hash SHA-256 divergente.' }
          Write-Host 'Integridade do ZIP confirmada por SHA-256.'
          $extract = Join-Path $dir 'extraido'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $exe = Join-Path $extract 'AssistentePc.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Executavel ausente no pacote.' }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($info.FileMajorPart -ne $expectedParts[0] -or
              $info.FileMinorPart -ne $expectedParts[1] -or
              $info.FileBuildPart -ne $expectedParts[2]) {
            throw "Versao do executavel nao corresponde a tag (versao: $($info.FileVersion))."
          }
          Write-Host "Versao do executavel validada: $($info.FileVersion)"
          $process = Start-Process -FilePath $exe -ArgumentList '--check-terminal' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Autoteste de terminal falhou (exit code $($process.ExitCode))."
          }
          Write-Host 'Autoteste de terminal permitido/restrito: OK.'
          Write-Host 'Nota: este teste nao instala o agente no PC pessoal nem valida UI Automation interativa.'
