name: Publicar ZIP do plugin Assistente

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node oficial
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validar identidade e skills
        run: node scripts/check-plugin.mjs

      - name: Gerar ZIP instalável e checksum
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('plugin/plugin.json','utf8')).version")"
          ARCHIVE="Assistente-plugin-v$VERSION.zip"
          git archive --format=zip --output="$ARCHIVE" HEAD:plugin
          unzip -t "$ARCHIVE"
          for entry in plugin.json .app.json .codex-plugin/plugin.json skills/desenvolvimento/SKILL.md skills/roteamento/SKILL.md skills/ux-ui/SKILL.md; do
            unzip -Z -1 "$ARCHIVE" | grep -Fx "$entry"
          done
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Publicar Release com ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="plugin-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release $TAG já existe. Não substituir automaticamente."
            exit 1
          fi
          gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            --target "$GITHUB_SHA" \
            --title "Assistente plugin v$VERSION" \
            --notes "ZIP completo do plugin Assistente, pronto para atualizar a instalação existente no ChatGPT. Contém manifestos e skills. Não inclui o Worker MCP, dados ou credenciais."
          gh release view "$TAG" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
